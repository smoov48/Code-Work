<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Praxis-Prüfung: Crypto-Shop</title>
    <style>

        body { font-family: Arial, sans-serif; padding: 20px; }
        .coin-box { border: 1px solid #ccc; padding: 15px; margin: 10px; display: inline-block; border-radius: 5px; }
        .warenkorb { margin-top: 30px; padding: 20px; background-color: #f0f0f0; border-radius: 5px; }
        input { color: black ; width: 50px; }
        button { padding: 5px 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🪙 Crypto Investment Shop</h1>
    
    <label for="anzahl-input">Menge zum Kaufen:</label>
    <input type="number" id="anzahl-input" value="1" min="1">

    <div id="shop-container">
        </div>

    <div class="warenkorb">
        <h2>🛒 Dein Depot</h2>
        <h3 id="gesamt-preis">Gesamtwert: 0 USD</h3>
    </div>

    <script src="app.js"></script>
</body>
</html>
